<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etología, Formas de Aprendizaje y Comunicación — Balance Training Academy®</title>
<link rel="stylesheet" href="styles.css">
<style>
  .bta-lift{transition:transform .25s var(--ease),box-shadow .25s var(--ease)!important;}
  .bta-lift:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)!important;}

  @media(max-width:980px){
    .bta-aprender,.bta-quien,.bta-incluye,.bta-hero-grid,.bta-blocks{grid-template-columns:1fr!important;}
    .bta-rel{grid-template-columns:1fr 1fr!important;}
  }
  @media(max-width:640px){.bta-rel{grid-template-columns:1fr!important;}}
  @media(max-width:1010px){.bta-nav-links{display:none!important;}.bta-burger{display:block!important;}}
  @media(max-width:760px){
    .bta-foot-grid{grid-template-columns:1fr!important;gap:36px!important;}
    .bta-sticky{justify-content:center!important;text-align:center;}
  }
</style>
</head>

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
