<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soy Andrea — Andrea Pigazzi · Balance Training Academy</title>
<link rel="stylesheet" href="styles.css">
<style>
a{color:var(--leaf);}a:hover{color:var(--sun-deep);}
.bta-lift{transition:transform .25s var(--ease),box-shadow .25s var(--ease)!important;}
.bta-lift:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)!important;}
.bta-pillar{transition:transform .25s var(--ease),background .25s!important;}
.bta-pillar:hover{transform:translateY(-5px);background:rgba(255,255,255,.09)!important;}
@media(max-width:980px){
  .bta-two{grid-template-columns:1fr!important;gap:44px!important;}
  .bta-pil3,.bta-roles{grid-template-columns:1fr!important;gap:20px!important;}
}
@media(max-width:1010px){.bta-nav-links{display:none!important;}.bta-burger{display:block!important;}}
@media(max-width:760px){
  .bta-foot-grid{grid-template-columns:1fr!important;gap:36px!important;}
  .bta-nums{grid-template-columns:1fr 1fr!important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="cursos-data.jsx"></script>
<script type="text/babel" src="andrea.jsx"></script>
</body>
</html>
